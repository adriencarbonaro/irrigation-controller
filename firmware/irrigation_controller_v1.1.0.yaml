# File : irrigation_controller.yaml
#
# Controls a drip irrigation system.  
# It controls 2 irrigation zones and a submersible pump
#
# Board: Generic ESP32-C3 Board (Generic)
# Definition: definitions/boards/generic-esp32c3/manifest.yaml
# >V1.0.0 : production versions

# module specific parameters
substitutions:
  nom_appareil: irrigation-ctrl1
  nom_friendly: irrigation_ctrl1
  nom_projet: OC.irrigation_controller_V1
  version: "1.1.0"
  LED_ON: 100ms
  LED_OFF: 4900ms
  EV_timeout: "30"
  CDE_EV1_PIN: GPIO03
  CDE_EV2_PIN: GPIO04
  PUMP_CDE_PIN: GPIO06
  SW_1_PIN: GPIO10
  SW_2_PIN: GPIO09
  STATUS_LED_PIN: GPIO20
  
globals:
  - type: bool
    id: ev1_active
    initial_value: "false"
  - type: bool
    id: ev2_active
    initial_value: "false"
    
esphome:
  name: ${nom_appareil}
  friendly_name: ${nom_friendly}
  project:
    name: ${nom_projet}
    version: ${version}

esp32:
  variant: ESP32C3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "pxbvuG+20dlxeLNGQ+HZN8x13qUB9Y79AQnYE4bcN6g="

ota:
  - platform: esphome

wifi:
  ap:
    ssid: irrigation_cont Fallback Hotspot
    password: "si6GjbceibFG"

  networks:
    - id: maison
      ssid: !secret wifi_maison_ssid
      password: !secret wifi_password
    - id: poules
      ssid: !secret wifi_poules_ssid
      password: !secret wifi_password
    - id: atelier
      ssid: !secret wifi_atelier_ssid
      password: !secret wifi_password
  on_connect:
    - light.turn_on:
        id: led_status
        effect: "blinks"
  on_disconnect:
      - light.turn_off: led_status
captive_portal:

sensor:
# mesure wifi RSSI in dBm
  - platform: wifi_signal
    name: "RSSI WiFi"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
    icon: "mdi:signal"
    
switch:
# irrigation solenoid valve 1 control
  - platform: gpio
    name: EV1
    pin: ${CDE_EV1_PIN}
    id: switch_EV1
# irrigation solenoid valve 2 control
  - platform: gpio
    name: EV2
    pin: ${CDE_EV2_PIN}
    id: switch_EV2
  # pump control
  - platform: gpio
    name: pump
    pin: ${PUMP_CDE_PIN}
    id: switch_pump

output:
  # Status LED 
  - platform: gpio
    pin: ${STATUS_LED_PIN}
    id: led_out
    
binary_sensor:
  # EV1 manual control button
  - platform: gpio
    name: button EV1
    pin:  ${SW_1_PIN}
    id: button_EV1
    filters:
      - invert:
    on_click:
      - then:
          - script.execute: toggle_EV1
  # EV2 manual control button
  - platform: gpio
    name: button EV2
    pin: ${SW_2_PIN}
    id: button_EV2
    filters:
      - invert:
    on_click:
      - then:
          - script.execute: toggle_EV2
  # exposes ev1_active global to HA          
  - platform: template
    name: "EV1 Active"
    id: ev1_active_sensor
    lambda: |-
      return id(ev1_active);
  # exposes ev2_active global to HA      
  - platform: template
    name: "EV2 Active"
    id: ev2_active_sensor
    lambda: |-
      return id(ev2_active);

button:      
  # virtual button to manually control EV1 in HA
  - platform: template
    name: EV1 Command
    id: button_control_EV1
    on_press:
      - then:
          - script.execute: toggle_EV1
  # virtual button to manually control EV2 in HA            
  - platform: template
    name: EV2 Command
    id: button_control_EV2
    on_press:
      - then:
          - script.execute: toggle_EV2  
            
light:
  # LED blinks when WiFi is connected
  - platform: binary
    output: led_out
    id: led_status
    internal: true      # not exposed to HA
    effects:
      - strobe:
          name: "blinks"
          colors:
            - state: true
              duration: ${LED_ON}
            - state: false
              duration: ${LED_OFF}
              
script:          
    # EV1 + pump control 
    # - toggles EV1
    # - if at least one EV is active, turn on pump and launch securityt timeout
  - id: toggle_EV1
    mode: single
    then:
      - lambda: |
          id(ev1_active) = !id(ev1_active);
      - binary_sensor.template.publish:
          id: ev1_active_sensor
          state: !lambda 'return id(ev1_active);'
      - switch.toggle: switch_EV1
      - if:
          condition:
            lambda: |
              return id(ev1_active)|id(ev2_active);
          then:
            - switch.turn_on: switch_pump
            - script.execute: valves_security_timeout
          else:
            - switch.turn_off: switch_pump
            - script.stop: valves_security_timeout
              
    # EV2 + pump control 
    # - toggles EV2
    # - if at least one EV is active, turn on pump and launch securityt timeout
  - id: toggle_EV2
    mode: single
    then:
      - lambda: |
          id(ev2_active) = !id(ev2_active);
      - binary_sensor.template.publish:
          id: ev2_active_sensor
          state: !lambda 'return id(ev2_active);'
      - switch.toggle: switch_EV2
      - if:
          condition:
            lambda: |
              return id(ev1_active)|id(ev2_active);
          then:
            - switch.turn_on: switch_pump
            - script.execute: valves_security_timeout
          else:
            - switch.turn_off: switch_pump
            - script.stop: valves_security_timeout

    # security timeout: turns off every command after EV_timeout
  - id: valves_security_timeout
    mode : restart
    then:
      - delay:
          minutes: ${EV_timeout}
      - switch.turn_off: switch_EV1
      - switch.turn_off: switch_EV2
      - switch.turn_off: switch_pump